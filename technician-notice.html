<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self' https://buotlfllagjwxopnbeit.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'"><meta name="robots" content="noindex,nofollow"><title>기술자 등록 개인정보·이용 안내 | YESSURI</title><link rel="icon" href="assets/icons/favicon.ico"><link rel="stylesheet" href="technician.css?v=1"><script src="technician-config.js?v=2" defer></script><script src="technician.js?v=2" defer></script><link rel="stylesheet" href="technician-entry.css?v=2"><script src="technician-registration-guide.js?v=1" defer></script></head><body data-technician-page="notice"><a class="skip-link" href="#main">본문 바로가기</a><header class="header"><div class="header-inner"><a class="brand" data-site href="index.html" aria-label="YESSURI 예스수리 홈"><img src="assets/images/yessuri-ys11-brand-color.png" alt="YESSURI"><small>예스수리</small></a><nav class="nav" aria-label="주요 메뉴"><a data-site href="find.html">전문가 찾기</a><a data-site href="guide.html">비용·이용안내</a><a data-site href="questions.html">수리 질문</a><a class="active" data-site href="register.html">기술자 등록</a></nav></div></header><p class="local-note">로컬 개발 접수 · 공개 사이트 접수와 분리되어 있습니다.</p><main class="container" id="main" tabindex="-1"><div class="crumb"><a data-site href="index.html">홈</a> › <a data-site href="register.html">기술자 등록</a> › 기술자 등록 개인정보·이용 안내</div><div id="root"><p role="status">화면을 준비하고 있습니다.</p><noscript>신청 접수와 조회에는 JavaScript가 필요합니다.</noscript></div><template id="registration-guide"><details class="entry-guide"><summary>등록 절차·준비물·이용 안내</summary><div class="entry-guide-content"><section aria-labelledby="process-title"><h2 id="process-title">업체 소개는 이렇게 등록합니다.</h2><ol class="reg-steps"><li><span class="reg-number">01</span><img class="reg-art-icon" src="assets/images/register-icon-4.png" alt="" width="110" height="110"><h3>등록 문의</h3><p>비공개 신청서를 작성하고 사진을 첨부합니다.</p></li><li><span class="reg-number">02</span><img class="reg-art-icon" src="assets/images/register-icon-5.png" alt="" width="110" height="110"><h3>정보 확인</h3><p>운영자가 연락처와 소개 내용을 확인합니다.</p></li><li><span class="reg-number">03</span><img class="reg-art-icon" src="assets/images/register-icon-6.png" alt="" width="110" height="110"><h3>소개 페이지 작성</h3><p>전문 분야·지역·사진을 정리합니다.</p></li><li><span class="reg-number">04</span><img class="reg-art-icon" src="assets/images/register-icon-7.png" alt="" width="110" height="110"><h3>확인 후 공개</h3><p>업체가 내용을 확인한 뒤 게시합니다.</p></li></ol></section><section aria-labelledby="prepare-title"><h2 id="prepare-title">등록 문의 전에 준비해 주세요.</h2><div class="reg-preparation"><article><h3>기본 정보</h3><ul><li>업체명 또는 활동명</li><li>공개할 상담 연락처</li><li>전문 분야와 출장 가능 지역</li><li>상담 가능 시간</li></ul></article><article><h3>소개 자료</h3><ul><li>업체 소개와 주요 작업</li><li>경력과 작업 사례</li><li>로고 또는 대표 사진</li><li>작업 사진 3~5장</li></ul></article></div><p class="reg-note">사진은 직접 촬영했거나 사용 허락을 받은 자료로 준비해 주세요.</p></section><section class="reg-faq" aria-labelledby="faq-title"><h2 id="faq-title">자주 묻는 질문</h2><details><summary>온라인 회원가입이 필요한가요?<span aria-hidden="true">⌃</span></summary><p>회원가입 없이 비공개 신청서를 작성할 수 있습니다. 접수번호와 설정한 비밀번호로 내 신청과 사진·답변을 확인하세요. 사진은 게시판에 첨부하거나 카카오톡으로 보낼 수 있습니다.</p></details><details><summary>고객 문의는 어떻게 받나요?<span aria-hidden="true">⌃</span></summary><p>업체 소개 페이지에 공개된 연락처로 고객이 직접 전화하거나 문자를 보냅니다.</p></details><details><summary>업체 정보를 수정하려면 어떻게 하나요?<span aria-hidden="true">⌃</span></summary><p>신청 내용과 사진은 ‘내 신청 확인’에서 본인 확인 후 수정할 수 있습니다. 이미 공개된 업체 프로필의 변경은 카카오톡으로 문의해 주세요.</p></details></section><section aria-labelledby="entry-privacy-title"><h2 id="entry-privacy-title">개인정보·비공개 접수 안내</h2><p>신청 내용과 사진은 본인 확인을 거친 신청자와 관리자만 확인합니다. 신청일로부터 6개월 동안 보관하며, 공개할 업체 정보와 사진은 별도로 협의합니다.</p><a class="btn" href="technician-notice.html">개인정보·이용 안내 전체 보기</a></section></div></details></template></main><footer class="footer"><div class="footer-inner"><div><a data-site href="index.html"><img src="assets/images/yessuri-ys11-brand-color.png" alt="YESSURI"></a>부산 우리 동네 집수리 연결 플랫폼</div><a href="technician-notice.html">개인정보·이용 안내</a><div>© 2026 YESSURI</div></div></footer></body></html>
